<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Matrovix — Innovating Next-Gen Materials</title>
  <meta name="description" content="Matrovix is a materials innovation company developing next-generation materials.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gelasio:wght@400;500&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <a href="#" class="brand" aria-label="Matrovix home">
      <svg class="brand-mark" width="40" height="40" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M16 2 29 9.5v13L16 30 3 22.5v-13Z" fill="rgba(10,14,35,.35)" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
        <path d="M9.5 21V11l6.5 5.6 6.5-5.6v10" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
      <span>MATROVIX</span>
    </a>
    <div class="hero-inner">
      <h1>Innovating <span class="nowrap">Next-Gen</span> Materials</h1>
      <a href="#contact" class="btn">Get in touch</a>
    </div>
  </header>

  <main>
    <section id="contact" class="section contact-section">
      <div class="container contact">
        <h2>Drop us a line!</h2>

        <form id="contact-form" class="form" action="https://script.google.com/macros/s/AKfycbzUHQ6Y47sXUX_00PvGY1wl_eEakjNUy938khZNdtB7ZYdaIPm0Ey6ezwA_umNBuIWSJQ/exec" method="POST">
          <input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off">

          <input type="text" name="name" placeholder="Name" aria-label="Name" autocomplete="name">
          <input type="email" name="email" placeholder="Email*" aria-label="Email" required autocomplete="email">
          <textarea name="message" rows="7" placeholder="Message" aria-label="Message"></textarea>

          <label class="check">
            <input type="checkbox" name="email_list" value="Yes">
            <span>Sign up for our email list for updates, promotions, and more.</span>
          </label>

          <button type="submit" class="btn-send">Send</button>
          <p id="form-status" class="status" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <span>© <span id="year">2026</span> Matrovix. All rights reserved.</span>
      <span>Materials Innovation</span>
    </div>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const form = document.getElementById('contact-form');
    const status = document.getElementById('form-status');
    const thank = 'Thank you! Your message has been sent. We\'ll be in touch soon.';
    if (location.hash === '#thanks') {
      status.className = 'status ok';
      status.textContent = thank;
      document.getElementById('contact').scrollIntoView();
    }
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const button = form.querySelector('button');
      button.disabled = true;
      status.className = 'status';
      status.textContent = 'Sending…';
      try {
        const res = await fetch(form.action, {
          method: 'POST',
          body: new URLSearchParams(new FormData(form))
        });
        const data = await res.json();
        if (!data.success) throw new Error(data.message);
        form.reset();
        status.className = 'status ok';
        status.textContent = thank;
      } catch (err) {
        status.className = 'status err';
        status.textContent = 'Sorry, something went wrong. Please try again in a moment.';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
